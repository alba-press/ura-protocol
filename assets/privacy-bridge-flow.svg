<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
  <title id="title">Ura Privacy Bridge flow</title>
  <desc id="desc">Cardano deposit, detected and confirmed, Mithril certified, Midnight submitted, indexer confirmed and claimed.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5b00"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6a00"/>
    </marker>
  </defs>
  <rect width="1120" height="1400" rx="40" fill="#08090c"/>
  <rect x="20" y="20" width="1080" height="1360" rx="32" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <text x="560" y="82" text-anchor="middle" fill="#ff6a00" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">URA LABS</text>
  <text x="560" y="138" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">Privacy Bridge</text>
  <text x="560" y="180" text-anchor="middle" fill="#9ca3af" font-family="Inter,Arial,sans-serif" font-size="22">Cardano Preprod → Midnight Preprod</text>

  <g fill="none" stroke="#ff6a00" stroke-width="7" marker-end="url(#arrow)">
    <path d="M560 400 V456"/>
    <path d="M560 620 V676"/>
    <path d="M560 840 V896"/>
    <path d="M560 1060 V1116"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="160" y="250" width="800" height="150" rx="26" fill="#111319" stroke="#ff6a00" stroke-width="3"/>
    <text x="560" y="342" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Cardano deposit</text>

    <rect x="160" y="470" width="800" height="150" rx="26" fill="#111319" stroke="#ff6a00" stroke-width="3"/>
    <text x="560" y="562" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Detected / confirmed</text>

    <rect x="160" y="690" width="800" height="150" rx="26" fill="#111319" stroke="url(#accent)" stroke-width="3"/>
    <text x="560" y="782" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Mithril certified</text>

    <rect x="160" y="910" width="800" height="150" rx="26" fill="#111319" stroke="#8b5cf6" stroke-width="3"/>
    <text x="560" y="1002" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Midnight submitted</text>

    <rect x="160" y="1130" width="800" height="150" rx="26" fill="#111319" stroke="#8b5cf6" stroke-width="3"/>
    <text x="560" y="1222" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="650">Indexer confirmed / CLAIMED</text>
  </g>
  <text x="560" y="1340" text-anchor="middle" fill="#737985" font-family="Inter,Arial,sans-serif" font-size="19">Detection is not certification. Submission is not settlement.</text>
</svg>