<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
  <title id="title">Ura Capacity Protocol flow</title>
  <desc id="desc">NIGHT holder, Model A authorization, receiver-side DUST capacity, Model B sponsorship, execution and receipt.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5b00"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6a00"/>
    </marker>
  </defs>
  <rect width="1120" height="1400" rx="40" fill="#08090c"/>
  <rect x="20" y="20" width="1080" height="1360" rx="32" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <text x="560" y="82" text-anchor="middle" fill="#ff6a00" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">URA LABS</text>
  <text x="560" y="138" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">Capacity Protocol</text>
  <text x="560" y="180" text-anchor="middle" fill="#9ca3af" font-family="Inter,Arial,sans-serif" font-size="22">Supply → capacity → bounded execution</text>

  <g fill="none" stroke="#ff6a00" stroke-width="7" marker-end="url(#arrow)">
    <path d="M560 380 V426"/>
    <path d="M560 580 V626"/>
    <path d="M560 780 V826"/>
    <path d="M560 1020 V1086"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="160" y="230" width="800" height="150" rx="26" fill="#111319" stroke="#ff6a00" stroke-width="3"/>
    <text x="560" y="322" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">NIGHT holder</text>

    <rect x="160" y="430" width="800" height="150" rx="26" fill="#111319" stroke="#ff6a00" stroke-width="3"/>
    <text x="560" y="522" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Model A authorization</text>

    <rect x="160" y="630" width="800" height="150" rx="26" fill="#111319" stroke="url(#accent)" stroke-width="3"/>
    <text x="560" y="722" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="650">Receiver-side DUST capacity</text>

    <rect x="160" y="830" width="800" height="190" rx="26" fill="#111319" stroke="#8b5cf6" stroke-width="3"/>
    <text x="560" y="910" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Model B sponsorship</text>
    <text x="560" y="960" text-anchor="middle" fill="#aeb3bd" font-size="22">Privacy Bridge + Midnight applications</text>

    <rect x="160" y="1100" width="800" height="150" rx="26" fill="#111319" stroke="#8b5cf6" stroke-width="3"/>
    <text x="560" y="1192" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="650">Execution + receipt</text>
  </g>
  <text x="560" y="1330" text-anchor="middle" fill="#737985" font-family="Inter,Arial,sans-serif" font-size="19">NIGHT remains with the holder. Receiver-side DUST funds execution.</text>
</svg>